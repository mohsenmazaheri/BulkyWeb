# Builds the solution and runs all unit tests on every push to master and every pull request.
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# The workflow only reads the code, so its token gets no write access
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Linux, like most servers and Docker: catches case-sensitive path problems that Windows hides
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install the .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore Bulky.sln

      - name: Build
        run: dotnet build Bulky.sln --no-restore --configuration Release

      - name: Run unit tests
        run: >
          dotnet test Bulky.sln --no-build --configuration Release
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results and coverage
        if: always()   # also when tests fail, so the results can be inspected
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      # Lesson 02: fail the build when a package (or a package it depends on) has a known vulnerability
      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list Bulky.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found, see the list above"
            exit 1
          fi

  # Lesson 17: build the Docker image and run the app with a real MariaDB, like a deployment would
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Create .env with throwaway passwords for this run
        run: |
          cat > .env <<'EOF'
          DB_PASSWORD=ci-db-password
          DB_ROOT_PASSWORD=ci-root-password
          ADMIN_PASSWORD=Ci-Admin-Passw0rd!
          EOF

      - name: Build the image and start app + MariaDB
        run: docker compose up --build --detach

      - name: Wait until /health reports healthy (app running, database reachable)
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health; then echo; echo "healthy after $i tries"; exit 0; fi
            sleep 3
          done
          echo "::error::The app did not become healthy"
          exit 1

      - name: The store shows the seeded books
        run: curl --fail --silent http://localhost:8080/ | grep --quiet "Fortune of Time"

      - name: The container runs as a non-root user
        run: test "$(docker compose exec -T web id -u)" != "0"

      - name: Restart the app container; keys and data must survive
        run: |
          docker compose exec -T web ls /app/keys | grep --quiet "key-"
          docker compose restart web
          for i in $(seq 1 40); do curl --fail --silent http://localhost:8080/health && exit 0; sleep 3; done
          exit 1

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Stop and remove containers and volumes
        if: always()
        run: docker compose down --volumes

  # The alternative for networks where containers cannot reach NuGet: compile on the host, Docker only packages
  docker-prebuilt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install the .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compile on the host (dotnet publish)
        run: dotnet publish BulkyWeb/BulkyWeb.csproj --configuration Release --output publish

      - name: Create .env with throwaway passwords for this run
        run: |
          cat > .env <<'ENVFILE'
          DB_PASSWORD=ci-db-password
          DB_ROOT_PASSWORD=ci-root-password
          ADMIN_PASSWORD=Ci-Admin-Passw0rd!
          ENVFILE

      - name: Build the prebuilt image and start app + MariaDB
        run: docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up --build --detach

      - name: Wait until /health reports healthy, and the store shows the seeded books
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health; then
              echo; curl --fail --silent http://localhost:8080/ | grep --quiet "Fortune of Time" && exit 0
            fi
            sleep 3
          done
          echo "::error::The prebuilt app did not become healthy"
          exit 1

      - name: Show container logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml logs

      - name: Stop and remove containers and volumes
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml down --volumes
